<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSONShape · JSON to TypeScript types and Zod, offline</title>
<meta name="description" content="Paste JSON or an API response, get TypeScript types or Zod schemas instantly. Runs in your browser, nothing is uploaded.">
<meta property="og:title" content="JSONShape · JSON to TypeScript and Zod">
<meta property="og:description" content="Paste JSON, get TypeScript types or Zod schemas. Offline, no signup.">
<meta property="og:image" content="https://mostaaafaomran-ctrl.github.io/jsonshape/og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--bg:#0b3d91;--bg2:#093479;--line:rgba(255,255,255,.14);--ink:#eaf2ff;--dim:#9db8e8;--acc:#ffd23f;--pane:#0a3480}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
background-color:var(--bg);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px}
header{padding:28px 24px 8px;max-width:1200px;margin:auto}
h1{margin:0;font-size:34px;letter-spacing:-1px}h1 b{color:var(--acc)}
p.sub{margin:6px 0 0;color:var(--dim);font-size:14px}
.bar{max-width:1200px;margin:16px auto 0;padding:0 24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:flex;border:2px solid var(--ink)}
.seg button{background:transparent;color:var(--ink);border:0;padding:8px 14px;font:inherit;cursor:pointer}
.seg button.on{background:var(--acc);color:#0b2a63;font-weight:700}
input[type=text]{background:var(--pane);border:2px solid var(--ink);color:var(--ink);padding:8px 10px;font:inherit;width:140px}
label{font-size:13px;color:var(--dim);display:flex;gap:6px;align-items:center}
.btn{background:var(--ink);color:#0b2a63;border:2px solid var(--ink);padding:8px 14px;font:inherit;font-weight:700;cursor:pointer}
.btn.acc{background:var(--acc);border-color:var(--acc)}
main{max-width:1200px;margin:16px auto;padding:0 24px 40px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){main{grid-template-columns:1fr}}
.box{border:2px solid var(--ink);background:var(--pane);display:flex;flex-direction:column;min-height:460px}
.box h2{margin:0;padding:8px 12px;font-size:12px;letter-spacing:2px;text-transform:uppercase;border-bottom:2px solid var(--ink);color:var(--acc);display:flex;justify-content:space-between}
textarea,pre{flex:1;margin:0;padding:12px;background:transparent;color:var(--ink);border:0;outline:0;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;resize:none;white-space:pre;overflow:auto;tab-size:2}
#err{color:#ff9c9c;font-size:12px;min-height:16px}
footer{text-align:center;color:var(--dim);font-size:12px;padding-bottom:30px}
footer a{color:var(--acc)}
</style>
</head>
<body>
<header>
<h1>JSON<b>Shape</b></h1>
<p class="sub">Paste JSON. Get TypeScript types or Zod schemas. Runs in your browser, nothing is uploaded.</p>
</header>
<div class="bar">
<div class="seg" id="fmt"><button data-v="ts" class="on">TypeScript</button><button data-v="zod">Zod</button></div>
<div class="seg" id="sty"><button data-v="interface" class="on">interface</button><button data-v="type">type</button></div>
<label>Root name <input type="text" id="name" value="Root"></label>
<label><input type="checkbox" id="exp" checked> export</label>
<button class="btn" id="sample">Sample</button>
<button class="btn acc" id="copy">Copy</button>
<span id="err"></span>
</div>
<main>
<section class="box"><h2><span>JSON in</span></h2><textarea id="in" spellcheck="false" placeholder='{"id":1,"name":"Ada"}'></textarea></section>
<section class="box"><h2><span>Types out</span><span id="stat"></span></h2><pre id="out"></pre></section>
</main>
<footer>Optional fields are detected when an array of objects disagrees. <a href="https://github.com/mostaaafaomran-ctrl/jsonshape">GitHub</a> · MIT</footer>
<script src="core.js"></script>
<script>
var $=function(i){return document.getElementById(i)},fmt='ts',sty='interface';
var SAMPLE={"id":42,"name":"Ada Lovelace","email":null,"tags":["math","code"],"address":{"city":"London","zip":"N1"},"orders":[{"id":1,"total":9.5,"paid":true},{"id":2,"total":20,"coupon":"X1"}]};
function run(){
 var t=$('in').value.trim();
 if(!t){$('out').textContent='';$('err').textContent='';$('stat').textContent='';return}
 try{
  var o=JSONShape.generate(JSON.parse(t),{name:$('name').value||'Root',format:fmt==='zod'?'zod':'ts',style:sty,exportAll:$('exp').checked});
  $('out').textContent=o;$('err').textContent='';$('stat').textContent=o.split('\n').length-1+' lines';
 }catch(e){$('err').textContent='Invalid JSON: '+e.message}
}
function seg(id,cb){$(id).addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 [].forEach.call($(id).children,function(x){x.classList.remove('on')});b.classList.add('on');cb(b.dataset.v);run()})}
seg('fmt',function(v){fmt=v});seg('sty',function(v){sty=v});
['in','name','exp'].forEach(function(i){$(i).addEventListener('input',run)});
$('sample').onclick=function(){$('in').value=JSON.stringify(SAMPLE,null,2);run()};
$('copy').onclick=function(){navigator.clipboard.writeText($('out').textContent);$('copy').textContent='Copied';setTimeout(function(){$('copy').textContent='Copy'},1200)};
$('in').value=JSON.stringify(SAMPLE,null,2);run();
</script>
</body>
</html>
